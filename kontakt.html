    <section id="kontakt" style="scroll-margin-top: 0;">
        <div class="kontakt-info">
            <h2>Kontakt</h2>
            <div class="kontakt-section">
                <h3>Fakturační údaje</h3>
                <div class="kontakt-detail">
                    <span class="d-icon">🏢</span>
                    <span>SYMBIO ONE s.r.o.<br>Vazová 2497<br>688 01 Uherský Brod</span>
                </div>
            </div>
            <div class="kontakt-section">
                <h3>Telefon</h3>
                <div class="kontakt-detail">
                    <span class="d-icon">🇨🇿</span>
                    <span><a href="tel:+420733173825">+420 733 173 825</a></span>
                </div>
                <div class="kontakt-detail">
                    <span class="d-icon">🇸🇰</span>
                    <span><a href="tel:+421917219074">+421 917 219 074</a></span>
                </div>
            </div>
            <div class="kontakt-section">
                <h3>E-mail</h3>
                <div class="kontakt-detail">
                    <span class="d-icon">✉️</span>
                    <a href="mailto:info@symbio.sk">info@symbio.sk</a>
                </div>
            </div>
        </div>
        <form class="kontakt-form" action="#" method="post">
            <input type="text" name="name" placeholder="Jméno a příjmení" required>
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="tel" name="phone" placeholder="Telefon">
            <textarea name="message" placeholder="Zpráva" rows="6"></textarea>
            <button type="submit">Odeslat</button>
        </form>
        <div class="kontakt-map">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2627.893836826477!2d17.259!3d49.0299!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4715f5e3b3b3b3b3%3A0x1234567890abcdef!2sVazov%C3%A1%202497%2C%20688%2001%20Uhersk%C3%BD%20Brod!5e0!3m2!1scs!2scz!4v1234567890123"
